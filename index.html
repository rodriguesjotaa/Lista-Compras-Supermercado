<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Compras de Supermercado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topo">
      <button type="button" class="btn-voltar" id="btnVoltar">← Voltar</button>
      <h1>Lista de Compras</h1>
    </header>

    <main>
      <form class="form-add" id="formAdd" novalidate>
        <input type="text" id="inputItem" placeholder="Ex.: Arroz, leite, tomate…" aria-label="Novo item" autocomplete="off">
        <button type="submit" class="btn-add">Adicionar item</button>
        <p class="erro" id="erroInput" role="alert" hidden>Digite o nome de um item antes de adicionar.</p>
      </form>

      <ul class="lista" id="lista"></ul>
      <p class="vazio" id="vazio" hidden>Sua lista está vazia. Adicione um item acima.</p>
    </main>
  </div>

  <div class="alerta" id="alerta" role="alert" hidden>
    <span class="alerta-icone" aria-hidden="true"><img src="img/sinal-de-aviso.png" alt="" class="icone-alerta"></span>
    <span class="alerta-texto" id="alertaTexto"></span>
    <button type="button" class="alerta-fechar" id="alertaFechar" aria-label="Fechar alerta">✕</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
